<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img"><title>A signature binds a key to a message</title><rect width="900" height="260" fill="#eef1e5"/><text x="30" y="38" fill="#173e39" font-family="sans-serif" font-size="21" font-weight="bold">A signature binds a key to a message</text><rect x="30" y="65" width="260" height="155" rx="8" fill="white" stroke="#94a88e"/><circle cx="55" cy="92" r="13" fill="#173e39"/><text x="55" y="97" text-anchor="middle" fill="#d9ef88" font-family="sans-serif" font-size="14">1</text><text x="78" y="98" fill="#173e39" font-family="sans-serif" font-size="17" font-weight="bold">Sign notice</text><text x="47" y="133" fill="#425d52" font-family="sans-serif" font-size="16">Original message</text><text x="47" y="159" fill="#425d52" font-family="sans-serif" font-size="16">Private key → signature</text><path d="M296 145h17m-6-6 6 6-6 6" fill="none" stroke="#173e39" stroke-width="2"/><rect x="320" y="65" width="260" height="155" rx="8" fill="white" stroke="#94a88e"/><circle cx="345" cy="92" r="13" fill="#173e39"/><text x="345" y="97" text-anchor="middle" fill="#d9ef88" font-family="sans-serif" font-size="14">2</text><text x="368" y="98" fill="#173e39" font-family="sans-serif" font-size="17" font-weight="bold">Verify notice</text><text x="337" y="133" fill="#425d52" font-family="sans-serif" font-size="16">Trusted public key</text><text x="337" y="159" fill="#425d52" font-family="sans-serif" font-size="16">Original message → valid</text><path d="M586 145h17m-6-6 6 6-6 6" fill="none" stroke="#173e39" stroke-width="2"/><rect x="610" y="65" width="260" height="155" rx="8" fill="white" stroke="#94a88e"/><circle cx="635" cy="92" r="13" fill="#173e39"/><text x="635" y="97" text-anchor="middle" fill="#d9ef88" font-family="sans-serif" font-size="14">3</text><text x="658" y="98" fill="#173e39" font-family="sans-serif" font-size="17" font-weight="bold">Change notice</text><text x="627" y="133" fill="#425d52" font-family="sans-serif" font-size="16">7 changed to 9</text><text x="627" y="159" fill="#425d52" font-family="sans-serif" font-size="16">Same signature → invalid</text></svg>